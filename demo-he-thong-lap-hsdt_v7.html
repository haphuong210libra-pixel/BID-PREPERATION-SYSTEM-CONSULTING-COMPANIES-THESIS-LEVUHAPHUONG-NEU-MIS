{const O={1:1,2:2,3:-2,4:3,5:6,9:2,10:5};S.tasks.forEach((r,i)=>{if(O[i]!==undefined){r[4]=ad(O[i]).slice(0,5);if(r[3])r[3]=ad(O[i]-1).slice(0,5)}});S.tasks[1][1]='Le Vu Ha Phuong';S.info.deadline=ad(4);DL=S.info.deadline}

function A(k,v,e){e&&e.stopPropagation();if(k!='menu')S.menu=null;if(k=='tab'||k=='go')S.edit=0;
if(!ED()&&(k=='ts'||k=='tm'||k=='addtask'||(k=='doc'||k=='df')&&!/(Download|View)$/.test(v)||k=='tsave')){T('Hồ sơ đang ở trạng thái '+S.status+' nên bị khóa. Chọn Update → Re-open proposal để chỉnh sửa');return}

if(S.role[0]=='P'&&['edit','save','addtask','tm','ts','doc','df','tsave'].includes(k)&&!/(Download|View)$/.test(v||'')){T('Partner/Director chỉ có quyền xem và phê duyệt');return}
const m={menu(){S.menu=S.menu==v?null:v},
go(){if(v=='profile'){T('Personal Profile nằm ngoài phạm vi demo');return}S.view=v;S.tab='Overview';S.from=null;if(v=='create')S.cm=[]},
role(){S.role=v;S.view='home'},open(){sync();load(v);S.from=S.view;S.view='proposal';S.tab='Overview'},openap(){sync();load(v);S.from=S.view;S.view='proposal';S.tab='Approval'},
tab(){S.tab=v},clr(){S.q='';S.fy=S.fm=S.ty=S.tm=''},st(){S.stab=v;S.q='';S.fy=S.fm=S.ty=S.tm=''},rt(){S.rtab=v},s1(){S.s1=v},s2(){S.s2=v},sclr(){S.s1=S.s2=''},rf(){S.rf=v},d1(){S.d1=v},d2(){S.d2=v},det(){S.det=v.split('|');S.modal='det'},
hru(){const e=EMP()[v],t=prompt('Chức vụ mới',e[1]);if(t){MEM.find(m=>m[0]==e[0])[1]=t;log('Updated employee profile: '+e[0]+' → '+t)}},
mkp(){const g=k=>$('#c_'+k).value.trim(),d=g('deadline');if(!g('name')||!g('client')||!g('scope')||!d){T('Vui lòng nhập đủ các trường có dấu *');return false}if(new Date(d)<new Date(new Date().toDateString())){T('Thời hạn nộp thầu không được nằm trong quá khứ');return false}const ms=[...new Set([g('leader'),...S.cm])];sync();PR.push(mk({name:g('name'),client:g('client'),dept:'Strategy, Risk & Transactions',approver:g('approver'),leader:g('leader'),deadline:d.split('-').reverse().join('/'),scope:g('scope'),members:ms,created:now().slice(0,10)},'New'));load(PR.length-1);S.from='home';S.view='proposal';S.tab='Overview';T('✉ Đã gửi email tới '+ms.length+' thành viên (kèm liên kết hồ sơ)')},close(){S.modal=null},

save(){const g=k=>$('#i_'+k).value.trim();if(!g('name')||!g('client')){T('Tên hồ sơ và khách hàng không được để trống');return false}if(!/^\d{2}\/\d{2}\/\d{4}$/.test(g('deadline'))){T('Deadline cần theo định dạng dd/mm/yyyy');return false}const O=S.old||{},LB={name:'Proposal name',client:'Client',dept:'Department',approver:'Approver',leader:'Leader',deadline:'Deadline',scope:'Scope'};Object.keys(LB).forEach(k=>{const n=g(k);if(O[k]!==undefined&&O[k]!==n)log('Edited Overview – '+LB[k]+(k=='scope'?' (updated)':': "'+O[k]+'" → "'+n+'"'));S.info[k]=n});const ad1=S.info.members.filter(x=>!(O.members||[]).includes(x)),rm1=(O.members||[]).filter(x=>!S.info.members.includes(x));if(ad1.length)log('Added members: '+ad1.join(', '));if(rm1.length)log('Removed members: '+rm1.join(', '));P=S.info.name+' – '+S.info.client;DL=S.info.deadline;S.edit=0;T('Đã lưu thông tin hồ sơ')},

else{const r=S.tasks[t.i],ch=[];if(r[0]!=full){ch.push('Name: "'+r[0].trim()+'" → "'+nm+'"');if(!t.sub)['T','F','O'].forEach(k=>S.docs[k].forEach(d=>{if(d[0]==r[0])d[0]=full}))}
[['Assignee',1,as],['Reviewer',2,rv],['Review date',3,rd],['Due date',4,du],['Status',5,st]].forEach(([l,j,n])=>{if(r[j]!==n){ch.push(l+': "'+(r[j]||'—')+'" → "'+(n||'—')+'"');r[j]=n}});r[0]=full;if(ch.length)log('Edited task "'+nm+'" – '+ch.join('; '))}

if(m[k]()!==false){if(S.status=='New'&&['doc','df','addtask','tm','ts','tsave','mk','dl','save'].includes(k)&&!/(Download|View)$/.test(v||''))S.status='Draft';render()}}
